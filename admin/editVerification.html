<!DOCTYPE html>
<html>
<head>
  <title>Edit Verification</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="../public/assetss/index.css">
  <link rel="stylesheet" href="../public/assets0/notify.css">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<section class="content" style="background-color: black;">

  <div id="a-notification" class="notification gone d-flex justify-content-start">
    <div class="d-flex flex-column"></div>
  </div>

  <div class="d-flex justify-content-between from-top">
    <div>
      <a href="../user/navbarPage.html"><img src="../public/assetss/img/ham.svg" alt="MENU" /></a>
    </div>
    <div class="d-flex flex-column">
      <div id="google_translate_element"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
        }
      </script>
      <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <div>
      <a href="../user/account.html">
        <div class="ph">
          <img src="../public/assetss/img/pers.svg" alt="PROFILE" />
        </div>
      </a>
    </div>
  </div>

  <div id="ev-loading" class="text-center text-secondary mt-4" style="color:#dbdbdb;">
    Loading verification...
  </div>

  <div id="ev-error" class="text-center text-secondary mt-5" style="display:none; color:#dbdbdb;">
    Failed to load verification
  </div>

  <div id="ev-content" style="display:none;">
    <div class="d-flex justify-content-between flex-wrap flex-md nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
      <h1 class="h2 text-gray" style="color:#dbdbdb;">Editing: <span id="ev-title">Verification</span></h1>
      <div class="btn-toolbar mb-2 mb-md 0"></div>
    </div>

    <div class="col py-3">
      <div class="row">
        <div class="col">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item active" id="ev-breadcrumb" style="color:#dbdbdb;">Verification</li>
            </ol>
          </nav>
        </div>
        <div class="col text-end fw-lighter" style="color:#dbdbdb;">
          <b>VerifyId:</b> <b class="text-white" id="ev-id"></b>
        </div>
      </div>
    </div>

    <div id="ev-message" class="alert" style="display:none;"></div>

    <form id="edit-verification-form">
      <div class="row form-group mb-4">
        <div class="col">
          <label for="email" style="color:#dbdbdb;">Email</label>
          <input type="text" class="form-control" id="email" name="email" placeholder="email" required>
        </div>
        <div class="col">
          <label for="username" style="color:#dbdbdb;">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
        </div>
      </div>

      <div class="row form-group mb-4">
        <div class="col">
          <label for="fullname" style="color:#dbdbdb;">Fullname</label>
          <input type="text" class="form-control" id="fullname" name="fullname" placeholder="fullname" required>
        </div>
        <div class="col">
          <label for="city" style="color:#dbdbdb;">City</label>
          <input type="text" class="form-control" id="city" name="city" placeholder="city" required>
        </div>
      </div>

      <div class="row form-group mb-4">
        <div class="col">
          <label for="gender" style="color:#dbdbdb;">Gender</label>
          <input type="text" class="form-control" id="gender" name="gender" placeholder="Gender" required>
        </div>
        <div class="col">
          <label for="dateofBirth" style="color:#dbdbdb;">Date of Birth</label>
          <input type="text" class="form-control" id="dateofBirth" name="dateofBirth" placeholder="dateofBirth" required>
        </div>
      </div>

      <div class="row form-group mb-4">
        <div class="col">
          <label for="marital" style="color:#dbdbdb;">Marital Status</label>
          <input type="text" class="form-control" id="marital" name="marital" placeholder="Marital" required>
        </div>
        <div class="col">
          <label for="age" style="color:#dbdbdb;">Age</label>
          <input type="text" class="form-control" id="age" name="age" placeholder="age" required>
        </div>
      </div>

      <div class="row form-group mb-4">
        <div class="col">
          <label for="address" style="color:#dbdbdb;">Address</label>
          <input type="text" class="form-control" id="address" name="address" placeholder="address" required>
        </div>
      </div>

      <div class="form-group mb-4">
        <button type="submit" class="btn btn-primary" id="ev-submit-btn">Update Verification</button>
        <button type="button" class="btn btn-danger" data-bs-toggle="modal" id="deleteButton" data-bs-target="#deleteModal">Delete Verification</button>
        <a href="./allVerification.html" class="btn btn-secondary">Back</a>
      </div>
    </form>
  </div>

</section>

<div class="modal fade" tabindex="-1" role="dialog" id="deleteModal">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">You are about to remove a verification record.</div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>
          This will remove the Verification record of <b class="fw-bold" id="ev-delete-name"></b><br/>
          Are you sure?
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="ev-confirm-delete">Yes, Remove Verification</button>
      </div>
    </div>
  </div>
</div>

<footer class="main-footer text-center">
  <strong>Copyrights 2023 @ <a href="#">pocketoptions</a>.</strong> All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="../public/assets0/notify.js"></script>
<script src="../public/assets/js/jquery.min.js"></script>
<script src="../public/assets/js/bootstrap.bundle.min.js"></script>
<script src="../public/assets/js/theme.min.js"></script>
<script src="../public/plugins/js/datatables.min.js"></script>
<script src="../public/plugins/js/summernote-bs4.min.js"></script>
<script src="../public/plugins/js/croppie.min.js"></script>
<script src="../public/plugins/js/loadingoverlay.min.js"></script>
<script src="../public/plugins/js/bootstrap4-toggle.min.js"></script>
<script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>

<script src="../public/js/convert/config.js"></script>
<script src="../public/js/convert/auth.js"></script>

<script>
(function () {
  var currentVerifyId = null;

  function getIdFromQuery() {
    try {
      return new URLSearchParams(window.location.search).get('id');
    } catch (e) {
      return null;
    }
  }

  function showMessage(text, isError) {
    var el = document.getElementById('ev-message');
    el.style.display = 'block';
    el.className = isError ? 'alert alert-danger' : 'alert alert-success';
    el.textContent = text;
  }

  function fillForm(verify) {
    var displayName = verify.fullname || verify.username || verify.email || 'Verification';
    currentVerifyId = verify._id;

    document.getElementById('ev-title').textContent = displayName;
    document.getElementById('ev-breadcrumb').textContent = displayName;
    document.getElementById('ev-id').textContent = verify._id || '';
    document.getElementById('ev-delete-name').textContent = displayName;

    document.getElementById('email').value = verify.email || '';
    document.getElementById('username').value = verify.username || '';
    document.getElementById('fullname').value = verify.fullname || '';
    document.getElementById('city').value = verify.city || '';
    document.getElementById('gender').value = verify.gender || '';
    document.getElementById('dateofBirth').value = verify.dateofBirth || '';
    document.getElementById('marital').value = verify.marital || '';
    document.getElementById('age').value = verify.age || '';
    document.getElementById('address').value = verify.address || '';

    document.getElementById('ev-loading').style.display = 'none';
    document.getElementById('ev-content').style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));

      var verifyId = getIdFromQuery();
      if (!verifyId) {
        throw new Error('Missing verification id in URL');
      }

      var res = await api.get('/admin/editVerification/' + verifyId + '/data');
      var data = res.data;
      if (!data.success || !data.verify) {
        throw new Error(data.error || 'Failed to load verification');
      }

      fillForm(data.verify);
    } catch (err) {
      console.error(err);
      document.getElementById('ev-loading').style.display = 'none';

      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }

      var errorEl = document.getElementById('ev-error');
      errorEl.style.display = 'block';
      errorEl.textContent =
        (err.response && err.response.data && err.response.data.error) ||
        err.message ||
        'Failed to load verification';
    }

    document.getElementById('edit-verification-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!currentVerifyId) return;

      var submitBtn = document.getElementById('ev-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        var payload = {
          email: document.getElementById('email').value.trim(),
          username: document.getElementById('username').value.trim(),
          fullname: document.getElementById('fullname').value.trim(),
          city: document.getElementById('city').value.trim(),
          gender: document.getElementById('gender').value.trim(),
          dateofBirth: document.getElementById('dateofBirth').value.trim(),
          marital: document.getElementById('marital').value.trim(),
          age: document.getElementById('age').value.trim(),
          address: document.getElementById('address').value.trim()
        };

        var res = await api.post('/admin/editVerification/' + currentVerifyId, payload);
        var data = res.data;

        if (!data.success) {
          throw new Error(data.error || 'Update failed');
        }

        showMessage(data.message || 'Verification updated successfully', false);
        if (data.verify) {
          fillForm(data.verify);
        }
      } catch (err) {
        console.error(err);
        showMessage(
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to update verification',
          true
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Verification';
      }
    });

    document.getElementById('ev-confirm-delete').addEventListener('click', async function () {
      if (!currentVerifyId) return;
      if (!window.confirm('Delete this verification permanently?')) return;

      try {
        var res = await api.post('/admin/deleteVerification/' + currentVerifyId);
        if (res.data && res.data.success) {
          window.location.href = './allVerification.html';
        } else {
          showMessage((res.data && res.data.error) || 'Delete failed', true);
        }
      } catch (err) {
        console.error(err);
        showMessage(
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to delete verification',
          true
        );
      }
    });
  });
})();
</script>

</body>
</html>
