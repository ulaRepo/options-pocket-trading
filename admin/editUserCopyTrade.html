<body>

<section class="content">

    <div class="main-content" id="main-content">

    <div class="card shadow-lg border-0"
         style="background:#171717;border-radius:20px;">

             style="background:#171717;">

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="../public/assets0/notify.js"></script>
<script src="../public/assets/js/jquery.min.js"></script>
<script src="../public/assets/js/bootstrap.bundle.min.js"></script>
<script src="../public/assets/js/theme.min.js"></script>
<script src="../public/plugins/js/datatables.min.js"></script>
<script src="../public/plugins/js/summernote-bs4.min.js"></script>
<script src="../public/plugins/js/croppie.min.js"></script>
<script src="../public/plugins/js/loadingoverlay.min.js"></script>

<script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>
<script src="../public/js/convert/config.js"></script>
<script src="../public/js/convert/auth.js"></script>

<script>
(function () {
  var currentId = '';

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function attrValue(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }

  function getIdFromQuery() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id') || '';
  }

  function ownerName(copyTrade) {
    var owner = copyTrade.owner || {};
    return owner.fullname || owner.username || copyTrade.userFullname || 'N/A';
  }

  function ownerEmail(copyTrade) {
    var owner = copyTrade.owner || {};
    return owner.email || copyTrade.userEmail || 'N/A';
  }

  function statusSelected(current, value) {
    var cur = String(current || '').toLowerCase();
    return cur === value ? ' selected' : '';
  }

  function renderForm(copyTrade) {
    return (
      '<form id="edit-user-copytrade-form">' +
        '<div class="row">' +
          '<div class="col-md-6 mb-3">' +
            '<label class="text-white">User Fullname</label>' +
            '<input type="text" class="form-control bg-dark text-white" value="' + attrValue(ownerName(copyTrade)) + '" disabled>' +
          '</div>' +
          '<div class="col-md-6 mb-3">' +
            '<label class="text-white">User Email</label>' +
            '<input type="text" class="form-control bg-dark text-white" value="' + attrValue(ownerEmail(copyTrade)) + '" disabled>' +
          '</div>' +
          '<div class="col-md-6 mb-3">' +
            '<label class="text-white">Trader Name</label>' +
            '<input type="text" class="form-control bg-dark text-white" value="' + attrValue(copyTrade.traderName) + '" disabled>' +
          '</div>' +
          '<div class="col-md-6 mb-3">' +
            '<label class="text-white">Amount ($)</label>' +
            '<input type="number" name="amount" id="amount" class="form-control" value="' + attrValue(copyTrade.amount) + '" required min="0" step="0.01">' +
          '</div>' +
          '<div class="col-md-6 mb-3">' +
            '<label class="text-white">Duration (Days)</label>' +
            '<input type="number" name="duration" id="duration" class="form-control" value="' + attrValue(copyTrade.duration) + '" required min="1">' +
          '</div>' +
          '<div class="col-md-6 mb-3">' +
            '<label class="text-white">Status</label>' +
            '<select name="status" id="status" class="form-control" required>' +
              '<option value="ongoing"' + statusSelected(copyTrade.status, 'ongoing') + '>Ongoing</option>' +
              '<option value="completed"' + statusSelected(copyTrade.status, 'completed') + '>Completed</option>' +
              '<option value="cancelled"' + statusSelected(copyTrade.status, 'cancelled') + '>Cancelled</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="mt-4 d-flex flex-wrap gap-2">' +
          '<button type="submit" class="btn btn-primary mr-2" id="update-uct-btn">' +
            '<i class="bi bi-check-circle"></i> Update Copy Trade' +
          '</button>' +
          '<a href="./allUserCopyTrades.html" class="btn btn-secondary">' +
            '<i class="bi bi-arrow-left"></i> Back' +
          '</a>' +
        '</div>' +
      '</form>'
    );
  }

  function bindForm(id) {
    var form = document.getElementById('edit-user-copytrade-form');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('update-uct-btn');
      btn.disabled = true;
      try {
        var res = await api.post('/admin/edit-user-copytrade/' + encodeURIComponent(id), {
          amount: document.getElementById('amount').value,
          duration: document.getElementById('duration').value,
          status: document.getElementById('status').value
        });
        if (res.data && res.data.success) {
          Swal.fire({
            icon: 'success',
            title: 'Success',
            text: res.data.message || 'Copy trade updated successfully',
            confirmButtonColor: '#28a745'
          });
          if (res.data.copyTrade) {
            document.getElementById('uct-form-wrap').innerHTML = renderForm(res.data.copyTrade);
            bindForm(id);
          }
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: (res.data && res.data.error) || 'Failed to update copy trade',
            confirmButtonColor: '#dc3545'
          });
        }
      } catch (err) {
        console.error(err);
        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: (err.response && err.response.data && err.response.data.error) || err.message || 'Failed to update copy trade',
          confirmButtonColor: '#dc3545'
        });
      } finally {
        var updateBtn = document.getElementById('update-uct-btn');
        if (updateBtn) updateBtn.disabled = false;
      }
    });
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var loading = document.getElementById('uct-loading');
    var wrap = document.getElementById('uct-form-wrap');
    currentId = getIdFromQuery();

    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));

      if (!currentId) {
        throw new Error('Missing copy trade id');
      }

      var res = await api.get('/admin/edit-user-copytrade/' + encodeURIComponent(currentId) + '/data');
      var data = res.data;
      if (!data.success || !data.copyTrade) {
        throw new Error(data.error || 'Failed to load copy trade');
      }

      wrap.innerHTML = renderForm(data.copyTrade);
      bindForm(currentId);
      loading.style.display = 'none';
      wrap.style.display = 'block';
    } catch (err) {
      console.error(err);
      loading.style.display = 'none';
      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: (err.response && err.response.data && err.response.data.error) || err.message || 'Failed to load copy trade',
        confirmButtonColor: '#dc3545'
      });
    }
  });
})();
</script>

</body>
</html>
