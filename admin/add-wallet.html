<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.7.0/remixicon.min.css">
    <link rel="stylesheet" href="/assetss/index.css">
    <link rel="stylesheet" href="/assets0/notify.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<section class="content">
    
    <!-- Top Navigation Bar -->
    <div class="d-flex justify-content-between from-top">
        <div>
            <a href="/user/navbarPage"><img src="/assetss/img/ham.svg" /></a>
        </div>
        <div class="d-flex flex-column">
            <div id="google_translate_element"></div>
            <script type="text/javascript">
            function googleTranslateElementInit() {
              new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
            }
            </script>
            <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        </div>
        <div>
            <a href="/user/account"><div class="ph"><img src="/assetss/img/pers.svg" /> </div></a>
        </div>
    </div>

    <!-- ==================== MAIN CONTENT CONTAINER ==================== -->
    <div class="main-content" id="main-content">
            <div class="main-content" id="main-content">

    <div class="container mt-4 mb-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add Wallet</h4>
            </div>

            <div class="card-body">

                <% if (messages && messages.error) { %>
                    <div class="alert alert-danger">
                        <%= messages.error %>
                    </div>
                <% } %>

                <form action="/admin/add-wallet" method="POST" enctype="multipart/form-data">

                    <div class="form-group">
                        <label class="text-dark">BTC Address</label>
                        <input
                            type="text"
                            name="btc_address"
                            class="form-control"
                            value="gj762346yshshshkshkshksd">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">BTC Image (Optional)</label>
                        <input
                            type="file"
                            name="btc_image"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">ETH Address</label>
                        <input
                            type="text"
                            name="eth_address"
                            class="form-control"
                            value="gj762346yshshshkshkshksd">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">ETH Image (Optional)</label>
                        <input
                            type="file"
                            name="eth_image"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">USDT Address</label>
                        <input
                            type="text"
                            name="usdt_address"
                            class="form-control"
                            value="gj762346yshshshkshkshksd">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">USDT Image (Optional)</label>
                        <input
                            type="file"
                            name="usdt_image"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">USDC Address</label>
                        <input
                            type="text"
                            name="usdc_address"
                            class="form-control"
                            value="gj762346yshshshkshkshksdusdc">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">USDC Image (Optional)</label>
                        <input
                            type="file"
                            name="usdc_image"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">CashApp</label>
                        <input
                            type="text"
                            name="cashapp"
                            class="form-control"
                            value="$Bitcoin">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">CashApp Image (Optional)</label>
                        <input
                            type="file"
                            name="cashapp_image"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">PayPal</label>
                        <input
                            type="text"
                            name="paypal"
                            class="form-control"
                            value="example@gmail.com">
                    </div>

                    <div class="form-group">
                        <label class="text-dark">PayPal Image (Optional)</label>
                        <input
                            type="file"
                            name="paypal_image"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Add Wallet
                    </button>

                </form>

            </div>
        </div>
    </div>

</div>
    </div>
    <!-- ================================================================ -->

</section>

<footer class="main-footer text-center">
    <strong style="color: white;"> Copyrights 2024 @ <a href="#">pocketoptions</a>. All Rights Reserved</strong>
</footer>

<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="assets0/notify.js"></script>
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/theme.min.js"></script>
<script src="plugins/js/datatables.min.js"></script>
<script src="plugins/js/summernote-bs4.min.js"></script>
<script src="plugins/js/croppie.min.js"></script>
<script src="plugins/js/loadingoverlay.min.js"></script>
<script src="plugins/js/bootstrap4-toggle.min.js"></script>
<script src="plugins/js/bootstrap-datepicker.min.js"></script>

</body>
</html>
