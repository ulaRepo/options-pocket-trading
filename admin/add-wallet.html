<!DOCTYPE html>
<html>
<head>
  <title>Add Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.7.0/remixicon.min.css">
  <link rel="stylesheet" href="../public/assetss/index.css">
  <link rel="stylesheet" href="../public/assets0/notify.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../public/js/convert/config.js"></script>
  <script src="../public/js/convert/auth.js"></script>

  <style>
    .main-content {
      width: 100%;
      min-height: 100vh;
      margin-top: 11%;
      padding: 20px;
    }
    @media (max-width: 576px) {
      .main-content { margin-top: 15%; }
    }
  </style>
</head>
<body>

<section class="content">

  <div class="d-flex justify-content-between from-top">
    <div>
      <a href="../user/navbarPage.html"><img src="../public/assetss/img/ham.svg" alt="menu" /></a>
    </div>
    <div class="d-flex flex-column">
      <div id="google_translate_element"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
        }
      </script>
      <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <div>
      <a href="../user/account.html">
        <div class="ph"><img src="../public/assetss/img/pers.svg" alt="account" /></div>
      </a>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <div class="container mt-4 mb-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Add Wallet</h4>
          <a href="./wallets.html" class="btn btn-light btn-sm">Back to Wallets</a>
        </div>

        <div class="card-body">
          <form id="add-wallet-form" autocomplete="off">

            <div class="form-group">
              <label class="text-dark">BTC Address</label>
              <input type="text" name="btc_address" id="btc_address" class="form-control">
            </div>

            <div class="form-group">
              <label class="text-dark">BTC Image (Optional)</label>
              <input type="file" name="btc_image" id="btc_image" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
              <label class="text-dark">ETH Address</label>
              <input type="text" name="eth_address" id="eth_address" class="form-control">
            </div>

            <div class="form-group">
              <label class="text-dark">ETH Image (Optional)</label>
              <input type="file" name="eth_image" id="eth_image" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
              <label class="text-dark">USDT Address</label>
              <input type="text" name="usdt_address" id="usdt_address" class="form-control">
            </div>

            <div class="form-group">
              <label class="text-dark">USDT Image (Optional)</label>
              <input type="file" name="usdt_image" id="usdt_image" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
              <label class="text-dark">USDC Address</label>
              <input type="text" name="usdc_address" id="usdc_address" class="form-control">
            </div>

            <div class="form-group">
              <label class="text-dark">USDC Image (Optional)</label>
              <input type="file" name="usdc_image" id="usdc_image" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
              <label class="text-dark">CashApp</label>
              <input type="text" name="cashapp" id="cashapp" class="form-control">
            </div>

            <div class="form-group">
              <label class="text-dark">CashApp Image (Optional)</label>
              <input type="file" name="cashapp_image" id="cashapp_image" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
              <label class="text-dark">PayPal</label>
              <input type="text" name="paypal" id="paypal" class="form-control">
            </div>

            <div class="form-group">
              <label class="text-dark">PayPal Image (Optional)</label>
              <input type="file" name="paypal_image" id="paypal_image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
              Add Wallet
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

</section>

<footer class="main-footer text-center">
  <strong style="color: white;"> Copyrights 2024 @ <a href="#">pocketoptions</a>. All Rights Reserved</strong>
</footer>

<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="../public/assets0/notify.js"></script>
<script src="../public/assets/js/jquery.min.js"></script>
<script src="../public/assets/js/bootstrap.bundle.min.js"></script>
<script src="../public/assets/js/theme.min.js"></script>
<script src="../public/plugins/js/datatables.min.js"></script>
<script src="../public/plugins/js/summernote-bs4.min.js"></script>
<script src="../public/plugins/js/croppie.min.js"></script>
<script src="../public/plugins/js/loadingoverlay.min.js"></script>
<script src="../public/plugins/js/bootstrap4-toggle.min.js"></script>
<script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>

<script>
(function () {
  function appendIfFile(formData, fieldName, inputId) {
    var input = document.getElementById(inputId);
    if (input && input.files && input.files[0]) {
      formData.append(fieldName, input.files[0]);
    }
  }

  document.getElementById('add-wallet-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    var formData = new FormData();
    formData.append('btc_address', document.getElementById('btc_address').value.trim());
    formData.append('eth_address', document.getElementById('eth_address').value.trim());
    formData.append('usdt_address', document.getElementById('usdt_address').value.trim());
    formData.append('usdc_address', document.getElementById('usdc_address').value.trim());
    formData.append('cashapp', document.getElementById('cashapp').value.trim());
    formData.append('paypal', document.getElementById('paypal').value.trim());

    appendIfFile(formData, 'btc_image', 'btc_image');
    appendIfFile(formData, 'eth_image', 'eth_image');
    appendIfFile(formData, 'usdt_image', 'usdt_image');
    appendIfFile(formData, 'usdc_image', 'usdc_image');
    appendIfFile(formData, 'cashapp_image', 'cashapp_image');
    appendIfFile(formData, 'paypal_image', 'paypal_image');

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      var result = await api.post('/admin/add-wallet', formData, {
        headers: { 'Content-Type': false },
        transformRequest: [
          function (data, headers) {
            if (data instanceof FormData) {
              delete headers['Content-Type'];
            }
            return data;
          }
        ]
      });

      Swal.fire({
        icon: 'success',
        title: 'Success',
        text: (result.data && result.data.message) || 'Wallet added successfully',
        confirmButtonText: 'OK'
      }).then(function () {
        window.location.href = './wallets.html';
      });
    } catch (err) {
      console.error(err);
      var msg = 'Failed to add wallet';
      if (err.response && err.response.data) {
        msg = err.response.data.error || err.response.data.message || msg;
      }
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: msg,
        confirmButtonText: 'OK'
      });
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Wallet';
    }
  });

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));
    } catch (err) {
      console.error(err);
      localStorage.removeItem('user');
      window.location.href = '../login.html';
    }
  });
})();
</script>

</body>
</html>
