<!DOCTYPE html>
<html>
<head>
  <title>Manage Copy Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.7.0/remixicon.min.css">
  <link rel="stylesheet" href="../public/assetss/index.css">
  <link rel="stylesheet" href="../public/assets0/notify.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../public/js/convert/config.js"></script>
  <script src="../public/js/convert/auth.js"></script>

  <style>
    .main-content { width: 100%; min-height: 100vh; margin-top: 11%; }
    @media (max-width: 576px) {
      .main-content { margin-top: 15%; }
    }
  </style>
</head>
<body>

<section class="content">

  <div class="d-flex justify-content-between from-top">
    <div>
      <a href="../user/navbarPage.html"><img src="../public/assetss/img/ham.svg" alt="menu" /></a>
    </div>
    <div class="d-flex flex-column">
      <div id="google_translate_element"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
        }
      </script>
      <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <div>
      <a href="../user/account.html">
        <div class="ph"><img src="../public/assetss/img/pers.svg" alt="account" /></div>
      </a>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <div class="container-fluid mt-4">
      <div class="card bg-dark text-white border-0">
        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Manage Copy Trades</h4>
            <a href="./addCopytrader.html" class="btn btn-primary">
              <i class="bi bi-plus-circle"></i>
              Add New Copy Trade
            </a>
          </div>

          <div id="copy-loading" class="text-center text-secondary py-4">
            Loading copy traders...
          </div>

          <div class="table-responsive">
            <table id="copy-trades-table" class="table table-dark table-bordered table-hover" style="display:none;">
              <thead>
                <tr>
                  <th>Trader Name</th>
                  <th>Win Rate</th>
                  <th>Profit Share</th>
                  <th colspan="3" class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="copy-trades-tbody"></tbody>
            </table>
          </div>

          <div id="copy-empty" class="text-center text-secondary py-4" style="display:none;">
            No Copy Traders Found
          </div>

        </div>
      </div>
    </div>
  </div>

</section>

<footer class="main-footer text-center">
  <strong style="color: white;"> Copyrights 2024 @ <a href="#">pocketoptions</a>. All Rights Reserved</strong>
</footer>

<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="../public/assets0/notify.js"></script>
<script src="../public/assets/js/jquery.min.js"></script>
<script src="../public/assets/js/bootstrap.bundle.min.js"></script>
<script src="../public/assets/js/theme.min.js"></script>
<script src="../public/plugins/js/datatables.min.js"></script>
<script src="../public/plugins/js/summernote-bs4.min.js"></script>
<script src="../public/plugins/js/croppie.min.js"></script>
<script src="../public/plugins/js/loadingoverlay.min.js"></script>
<script src="../public/plugins/js/bootstrap4-toggle.min.js"></script>
<script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>

<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderCopyTrades(copyTrades) {
    var loading = document.getElementById('copy-loading');
    var table = document.getElementById('copy-trades-table');
    var tbody = document.getElementById('copy-trades-tbody');
    var empty = document.getElementById('copy-empty');

    if (loading) loading.style.display = 'none';

    if (!copyTrades || !copyTrades.length) {
      if (table) table.style.display = 'none';
      if (empty) empty.style.display = 'block';
      return;
    }

    tbody.innerHTML = copyTrades.map(function (trade) {
      var id = escapeHtml(trade._id);
      return (
        '<tr data-id="' + id + '">' +
          '<td>' + escapeHtml(trade.traderName) + '</td>' +
          '<td>' + escapeHtml(trade.winRate) + '%</td>' +
          '<td>' + escapeHtml(trade.profitShare) + '%</td>' +
          '<td>' +
            '<a href="./addCopytrader.html" class="btn btn-success btn-sm">Add</a>' +
          '</td>' +
          '<td>' +
            '<a href="./editCopytrader.html?id=' + id + '" class="btn btn-primary btn-sm">Edit</a>' +
          '</td>' +
          '<td>' +
            '<button type="button" class="btn btn-danger btn-sm btn-delete-copy" data-id="' + id + '">Delete</button>' +
          '</td>' +
        '</tr>'
      );
    }).join('');

    if (empty) empty.style.display = 'none';
    if (table) table.style.display = 'table';

    Array.prototype.forEach.call(document.querySelectorAll('.btn-delete-copy'), function (btn) {
      btn.addEventListener('click', async function () {
        var tradeId = btn.getAttribute('data-id');
        if (!tradeId) return;

        var result = await Swal.fire({
          title: 'Delete copy trader?',
          text: 'This cannot be undone.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Delete',
          cancelButtonText: 'Cancel'
        });

        if (!result.isConfirmed) return;

        try {
          var res = await api.post('/admin/delete-copytrade/' + tradeId);
          if (res.data && res.data.success) {
            var row = btn.closest('tr');
            if (row) row.remove();
            if (!tbody.children.length) {
              table.style.display = 'none';
              if (empty) empty.style.display = 'block';
            }
            Swal.fire({
              icon: 'success',
              title: 'Deleted',
              text: res.data.message || 'Copy trade deleted',
              timer: 1500,
              showConfirmButton: false
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Error',
              text: (res.data && res.data.error) || 'Delete failed'
            });
          }
        } catch (err) {
          console.error(err);
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text:
              (err.response && err.response.data && err.response.data.error) ||
              err.message ||
              'Delete failed'
          });
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));

      var res = await api.get('/admin/all-copytrades/data');
      var data = res.data;
      if (!data.success) {
        throw new Error(data.error || 'Failed to load copy trades');
      }
      renderCopyTrades(data.copyTrades || []);
    } catch (err) {
      console.error(err);
      var loading = document.getElementById('copy-loading');
      if (loading) loading.style.display = 'none';

      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }

      var empty = document.getElementById('copy-empty');
      if (empty) {
        empty.style.display = 'block';
        empty.textContent =
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to load copy trades';
      }
    }
  });
})();
</script>

</body>
</html>
