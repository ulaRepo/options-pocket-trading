<!DOCTYPE html>
<html>
<head>
  <title>Edit Deposit</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="../public/assetss/index.css">
  <link rel="stylesheet" href="../public/assets0/notify.css">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<section class="content" style="background-color: black;">

  <div id="a-notification" class="notification gone d-flex justify-content-start">
    <div class="d-flex flex-column"></div>
  </div>

  <div class="d-flex justify-content-between from-top">
    <div>
      <a href="../user/navbarPage.html"><img src="../public/assetss/img/ham.svg" alt="MENU" /></a>
    </div>
    <div class="d-flex flex-column">
      <div id="google_translate_element"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
        }
      </script>
      <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <div>
      <a href="../user/account.html">
        <div class="ph">
          <img src="../public/assetss/img/pers.svg" alt="PROFILE" />
        </div>
      </a>
    </div>
  </div>

  <div id="ed-loading" class="text-center text-secondary mt-4" style="color:#dbdbdb;">
    Loading deposit...
  </div>

  <div id="ed-error" class="text-center text-secondary mt-5" style="display:none; color:#dbdbdb;">
    Failed to load deposit
  </div>

  <div id="ed-content" style="display:none;">
    <div class="d-flex justify-content-between flex-wrap flex-md nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
      <h1 class="h2 text-gray" style="color:#dbdbdb;">Editing: Deposit</h1>
      <div class="btn-toolbar mb-2 mb-md 0"></div>
    </div>

    <div class="col py-3">
      <div class="row">
        <div class="col">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item active" id="ed-breadcrumb" style="color:#dbdbdb;">Deposit</li>
            </ol>
          </nav>
        </div>
        <div class="col text-end fw-lighter" style="color:#dbdbdb;">
          <b>DepositId:</b> <b style="color: white;" id="ed-id"></b>
        </div>
      </div>
    </div>

    <div id="ed-message" class="alert" style="display:none;"></div>

    <form id="edit-deposit-form">
      <div class="row form-group mb-4">
        <div class="col">
          <label for="type" style="color:#dbdbdb;">Payment Method</label>
          <input type="text" class="form-control" id="type" name="type" placeholder="Payment Method" readonly required>
        </div>
        <div class="col">
          <label for="amount" style="color:#dbdbdb;">Amount</label>
          <input type="text" class="form-control" id="amount" name="amount" placeholder="Amount" readonly required>
        </div>
      </div>

      <div class="row form-group mb-4">
        <div class="col">
          <label for="status" style="color:#dbdbdb;">Deposit Status</label>
          <input type="text" class="form-control" id="status" name="status" placeholder="pending / approved / rejected" required>
        </div>
        <div class="col">
          <label for="narration" style="color:#dbdbdb;">Deposit Narration</label>
          <input type="text" class="form-control" id="narration" name="narration" placeholder="Deposit Narration" readonly required>
        </div>
      </div>

      <div class="form-group mb-4">
        <button type="submit" class="btn btn-primary" id="ed-submit-btn">Update Deposit</button>
        <button type="button" class="btn btn-danger" data-bs-toggle="modal" id="deleteButton" data-bs-target="#deleteModal">Delete Deposit</button>
        <a href="./allFunding.html" class="btn btn-secondary">Back</a>
      </div>
    </form>
  </div>

</section>

<div class="modal fade" tabindex="-1" role="dialog" id="deleteModal">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">You are about to remove a deposit record.</div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>
          This will remove the Deposit record of <b class="fw-bold" id="ed-delete-id"></b><br/>
          Are you sure?
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="ed-confirm-delete">Yes, Remove Deposit</button>
      </div>
    </div>
  </div>
</div>

<footer class="main-footer text-center">
  <strong>Copyrights 2023 @ <a href="#">pocketoptions</a>.</strong> All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="../public/assets0/notify.js"></script>
<script src="../public/assets/js/jquery.min.js"></script>
<script src="../public/assets/js/bootstrap.bundle.min.js"></script>
<script src="../public/assets/js/theme.min.js"></script>
<script src="../public/plugins/js/datatables.min.js"></script>
<script src="../public/plugins/js/summernote-bs4.min.js"></script>
<script src="../public/plugins/js/croppie.min.js"></script>
<script src="../public/plugins/js/loadingoverlay.min.js"></script>
<script src="../public/plugins/js/bootstrap4-toggle.min.js"></script>
<script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>

<script src="../public/js/convert/config.js"></script>
<script src="../public/js/convert/auth.js"></script>

<script>
(function () {
  var currentDepositId = null;

  function getIdFromQuery() {
    try {
      return new URLSearchParams(window.location.search).get('id');
    } catch (e) {
      return null;
    }
  }

  function showMessage(text, isError) {
    var el = document.getElementById('ed-message');
    el.style.display = 'block';
    el.className = isError ? 'alert alert-danger' : 'alert alert-success';
    el.textContent = text;
  }

  function fillForm(deposit) {
    currentDepositId = deposit._id;

    document.getElementById('ed-breadcrumb').textContent = deposit.type || 'Deposit';
    document.getElementById('ed-id').textContent = deposit._id || '';
    document.getElementById('ed-delete-id').textContent = deposit._id || '';

    document.getElementById('type').value = deposit.type || '';
    document.getElementById('amount').value = deposit.amount != null ? deposit.amount : '';
    document.getElementById('status').value = deposit.status || 'pending';
    document.getElementById('narration').value = deposit.narration || '';

    document.getElementById('ed-loading').style.display = 'none';
    document.getElementById('ed-content').style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));

      var depositId = getIdFromQuery();
      if (!depositId) {
        throw new Error('Missing deposit id in URL');
      }

      var res = await api.get('/admin/editDeposit/' + depositId + '/data');
      var data = res.data;
      if (!data.success || !data.deposit) {
        throw new Error(data.error || 'Failed to load deposit');
      }

      fillForm(data.deposit);
    } catch (err) {
      console.error(err);
      document.getElementById('ed-loading').style.display = 'none';

      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }

      var errorEl = document.getElementById('ed-error');
      errorEl.style.display = 'block';
      errorEl.textContent =
        (err.response && err.response.data && err.response.data.error) ||
        err.message ||
        'Failed to load deposit';
    }

    document.getElementById('edit-deposit-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!currentDepositId) return;

      var submitBtn = document.getElementById('ed-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        var payload = {
          type: document.getElementById('type').value.trim(),
          amount: document.getElementById('amount').value.trim(),
          status: document.getElementById('status').value.trim(),
          narration: document.getElementById('narration').value.trim()
        };

        var res = await api.post('/admin/editDeposit/' + currentDepositId, payload);
        var data = res.data;

        if (!data.success) {
          throw new Error(data.error || 'Update failed');
        }

        showMessage(data.message || 'Deposit updated successfully', false);
        if (data.deposit) {
          fillForm(data.deposit);
        }
      } catch (err) {
        console.error(err);
        showMessage(
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to update deposit',
          true
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Deposit';
      }
    });

    document.getElementById('ed-confirm-delete').addEventListener('click', async function () {
      if (!currentDepositId) return;
      if (!window.confirm('Delete this deposit permanently?')) return;

      try {
        var res = await api.post('/admin/deleteDeposit/' + currentDepositId);
        if (res.data && res.data.success) {
          window.location.href = './allFunding.html';
        } else {
          showMessage((res.data && res.data.error) || 'Delete failed', true);
        }
      } catch (err) {
        console.error(err);
        showMessage(
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to delete deposit',
          true
        );
      }
    });
  });
})();
</script>

</body>
</html>
