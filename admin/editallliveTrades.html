<!DOCTYPE html>
<html>
<head>
  <title>Edit livetrade</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.7.0/remixicon.min.css">
  <link rel="stylesheet" href="../public/assetss/index.css">
  <link rel="stylesheet" href="../public/assets0/notify.css">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<section class="content" style="background-color: black;">

  <div id="a-notification" class="notification gone d-flex justify-content-start">
    <div class="d-flex flex-column"></div>
  </div>

  <div class="d-flex justify-content-between from-top">
    <div>
      <a href="../user/navbarPage.html"><img src="../public/assetss/img/ham.svg" alt="MENU" /></a>
    </div>
    <div class="d-flex flex-column">
      <div id="google_translate_element"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
        }
      </script>
      <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <div>
      <a href="../user/account.html">
        <div class="ph">
          <img src="../public/assetss/img/pers.svg" alt="PROFILE" />
        </div>
      </a>
    </div>
  </div>

  <div class="d-flex justify-content-between flex-wrap flex-md nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2 text-gray">Editing: Livetrade</h1>
    <div class="btn-toolbar mb-2 mb-md 0"></div>
  </div>

  <div id="lt-loading" class="text-center text-white mt-4">Loading live trade...</div>
  <div id="lt-error" class="alert alert-danger" style="display:none;"></div>
  <div id="lt-success" class="alert alert-success" style="display:none;"></div>
  <div id="lt-content" style="display:none;"></div>

</section>

<div class="modal fade" tabindex="-1" role="dialog" id="deleteModal">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">You are about to remove a user Livetrade record.</div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>
          This will remove the User livetrade record of <b class="fw-bold" id="delete-livetrade-id"></b><br/>
          Are you sure?
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="confirm-delete-livetrade">Yes, Remove livetrade</button>
      </div>
    </div>
  </div>
</div>

<footer class="main-footer text-center">
  <strong>  Copyrights 2023 @ <a href="#"> pocketoptions </a>.</strong> All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
<script src="../public/assets0/notify.js"></script>
<script src="../public/assets/js/jquery.min.js"></script>
<script src="../public/assets/js/bootstrap.bundle.min.js"></script>
<script src="../public/assets/js/theme.min.js"></script>
<script src="../public/plugins/js/datatables.min.js"></script>
<script src="../public/plugins/js/summernote-bs4.min.js"></script>
<script src="../public/plugins/js/croppie.min.js"></script>
<script src="../public/plugins/js/loadingoverlay.min.js"></script>
<script src="../public/plugins/js/bootstrap4-toggle.min.js"></script>
<script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>
<script src="../public/js/convert/config.js"></script>
<script src="../public/js/convert/auth.js"></script>

<script>
(function () {
  var currentId = '';

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function attrValue(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }

  function getIdFromQuery() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id') || '';
  }

  function showError(msg) {
    var el = document.getElementById('lt-error');
    document.getElementById('lt-success').style.display = 'none';
    el.textContent = msg;
    el.style.display = 'block';
  }

  function showSuccess(msg) {
    var el = document.getElementById('lt-success');
    document.getElementById('lt-error').style.display = 'none';
    el.textContent = msg;
    el.style.display = 'block';
  }

  function renderForm(livetrade) {
    var stopLoss = livetrade.stopLoss != null ? livetrade.stopLoss : livetrade.stoploss;
    return (
      '<div class="col py-3">' +
        '<div class="row">' +
          '<div class="col">' +
            '<nav aria-label="breadcrumb">' +
              '<ol class="breadcrumb">' +
                '<li class="breadcrumb-item active"> </li>' +
              '</ol>' +
            '</nav>' +
          '</div>' +
          '<div class="col text-end fw-lighter">' +
            '<b>LivetradeId:</b> <b style="color: white;">' + escapeHtml(livetrade._id) + '</b>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<form id="edit-livetrade-form">' +
        '<div class="row form-group mb-4">' +
          '<div class="col">' +
            '<label for="type">Market</label>' +
            '<input type="text" class="form-control" id="type" name="type" value="' + attrValue(livetrade.type) + '" placeholder="Payment Method" required>' +
          '</div>' +
          '<div class="col">' +
            '<label for="currencypair">Currency Pair</label>' +
            '<input type="text" class="form-control" id="currencypair" name="currencypair" value="' + attrValue(livetrade.currencypair) + '" placeholder="Currency Pair" required>' +
          '</div>' +
        '</div>' +
        '<div class="row form-group mb-4">' +
          '<div class="col">' +
            '<label for="lotsize">Lot Size </label>' +
            '<input type="text" class="form-control" id="lotsize" name="lotsize" value="' + attrValue(livetrade.lotsize) + '" placeholder="Lot Size" required>' +
          '</div>' +
          '<div class="col">' +
            '<label for="entryPrice">Entry Price </label>' +
            '<input type="text" class="form-control" id="entryPrice" name="entryPrice" value="' + attrValue(livetrade.entryPrice) + '" placeholder="Entry Price" required>' +
          '</div>' +
        '</div>' +
        '<div class="row form-group mb-4">' +
          '<div class="col">' +
            '<label for="stopLoss">Stop Loss</label>' +
            '<input type="text" class="form-control" id="stopLoss" name="stopLoss" value="' + attrValue(stopLoss) + '" placeholder="Stop Loss" required>' +
          '</div>' +
          '<div class="col">' +
            '<label for="takeProfit">Take Profit</label>' +
            '<input type="text" class="form-control" id="takeProfit" name="takeProfit" value="' + attrValue(livetrade.takeProfit) + '" placeholder="Take Profit" required>' +
          '</div>' +
        '</div>' +
        '<div class="row form-group mb-4">' +
          '<div class="col">' +
            '<label for="action">Action</label>' +
            '<input type="text" class="form-control" id="action" name="action" value="' + attrValue(livetrade.action) + '" placeholder="Notification" required>' +
          '</div>' +
        '</div>' +
        '<div class="form-group mb-4">' +
          '<button type="submit" class="btn btn-primary" id="update-livetrade-btn">Update Livetrade</button> ' +
          '<button type="button" class="btn btn-danger" data-bs-toggle="modal" id="deleteButton" data-bs-target="#deleteModal">Delete Livetrade</button>' +
        '</div>' +
      '</form>'
    );
  }

  function bindForm(id) {
    var form = document.getElementById('edit-livetrade-form');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('update-livetrade-btn');
      btn.disabled = true;
      btn.textContent = 'Updating...';
      try {
        var res = await api.post('/admin/edit-livetrade/' + encodeURIComponent(id), {
          type: document.getElementById('type').value.trim(),
          currencypair: document.getElementById('currencypair').value.trim(),
          lotsize: document.getElementById('lotsize').value.trim(),
          entryPrice: document.getElementById('entryPrice').value.trim(),
          stopLoss: document.getElementById('stopLoss').value.trim(),
          takeProfit: document.getElementById('takeProfit').value.trim(),
          action: document.getElementById('action').value.trim()
        });
        if (res.data && res.data.success) {
          showSuccess(res.data.message || 'Updated livetrade successfully');
          if (res.data.trade) {
            document.getElementById('lt-content').innerHTML = renderForm(res.data.trade);
            document.getElementById('delete-livetrade-id').textContent = res.data.trade._id;
            bindForm(id);
          }
        } else {
          showError((res.data && res.data.error) || 'Failed to update live trade');
        }
      } catch (err) {
        console.error(err);
        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }
        showError(
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to update live trade'
        );
      } finally {
        var updateBtn = document.getElementById('update-livetrade-btn');
        if (updateBtn) {
          updateBtn.disabled = false;
          updateBtn.textContent = 'Update Livetrade';
        }
      }
    });
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var loading = document.getElementById('lt-loading');
    var content = document.getElementById('lt-content');
    currentId = getIdFromQuery();

    document.getElementById('confirm-delete-livetrade').addEventListener('click', async function () {
      if (!currentId) return;
      try {
        var res = await api.post('/admin/deletelivetrade/' + encodeURIComponent(currentId));
        if (res.data && res.data.success) {
          window.location.href = './allliveTrades.html';
        } else {
          showError((res.data && res.data.error) || 'Failed to delete live trade');
        }
      } catch (err) {
        console.error(err);
        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }
        showError(
          (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to delete live trade'
        );
      }
    });

    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));

      if (!currentId) {
        throw new Error('Missing live trade id');
      }

      var res = await api.get('/admin/edit-livetrade/' + encodeURIComponent(currentId) + '/data');
      var data = res.data;
      if (!data.success || !data.livetrade) {
        throw new Error(data.error || 'Failed to load live trade');
      }

      content.innerHTML = renderForm(data.livetrade);
      document.getElementById('delete-livetrade-id').textContent = data.livetrade._id;
      bindForm(currentId);
      if (loading) loading.style.display = 'none';
      content.style.display = 'block';
    } catch (err) {
      console.error(err);
      if (loading) loading.style.display = 'none';
      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }
      showError(
        (err.response && err.response.data && err.response.data.error) ||
        err.message ||
        'Failed to load live trade'
      );
    }
  });
})();
</script>

</body>
</html>
