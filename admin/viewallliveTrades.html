<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDate(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return escapeHtml(value);
    return escapeHtml(d.toLocaleString());
  }

  function getIdFromQuery() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id') || '';
  }

  function row(label, value, black) {
    var labelStyle = black ? ' style="color: black;"' : '';
    var valueStyle = black ? ' style="color: black;"' : '';
    return (
      '<li class="list-group-item">' +
        '<div class="row">' +
          '<div class="col" style="max-width: 140px"><b' + labelStyle + '>' + label + '</b></div>' +
          '<div class="col"' + valueStyle + '>' + escapeHtml(value) + '</div>' +
        '</div>' +
      '</li>'
    );
  }

  function renderLivetrade(livetrade) {
    var stopLoss = livetrade.stopLoss != null ? livetrade.stopLoss : livetrade.stoploss;
    return (
      '<div class="col py-3">' +
        '<div class="row">' +
          '<div class="col">' +
            '<nav aria-label="breadcrumb">' +
              '<ol class="breadcrumb">' +
                '<li class="breadcrumb-item active text-black"></li>' +
              '</ol>' +
            '</nav>' +
          '</div>' +
          '<div class="col text-end fw-lighter">' +
            '<b>LivetradeId:</b>  <b class="text-white">' + escapeHtml(livetrade._id) + '</b>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<ul class="list-group">' +
        row('Type', livetrade.type, false) +
        row('Currency Pair:', livetrade.currencypair, true) +
        row('Lot Size:', livetrade.lotsize, true) +
        row('Entry Price:', livetrade.entryPrice, true) +
        row('Stop Loss:', stopLoss, true) +
        row('Take Profit:', livetrade.takeProfit, true) +
        row('Action:', livetrade.action, true) +
        '<li class="list-group-item">' +
          '<div class="row">' +
            '<div class="col" style="max-width: 140px"><b style="color: black;">Date Created:</b></div>' +
            '<div class="col" style="color: black;">' + formatDate(livetrade.createdAt) + '</div>' +
          '</div>' +
        '</li>' +
        '<li class="list-group-item">' +
          '<div class="row">' +
            '<div class="col" style="max-width: 140px"><b style="color: black;">Date Modified:</b></div>' +
            '<div class="col" style="color: black;">' + formatDate(livetrade.updatedAt) + '</div>' +
          '</div>' +
        '</li>' +
      '</ul>'
    );
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var loading = document.getElementById('lt-loading');
    var errorEl = document.getElementById('lt-error');
    var content = document.getElementById('lt-content');
    var id = getIdFromQuery();

    try {
      var me = await api.get('/auth/me');
      if (!me.data || me.data.role !== 'ADMIN') {
        window.location.href = '../index.html';
        return;
      }
      localStorage.setItem('user', JSON.stringify(me.data));

      if (!id) {
        throw new Error('Missing live trade id');
      }

      var res = await api.get('/admin/view-livetrade/' + encodeURIComponent(id) + '/data');
      var data = res.data;
      if (!data.success || !data.livetrade) {
        throw new Error(data.error || 'Failed to load live trade');
      }

      content.innerHTML = renderLivetrade(data.livetrade);
      if (loading) loading.style.display = 'none';
      content.style.display = 'block';
    } catch (err) {
      console.error(err);
      if (loading) loading.style.display = 'none';

      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }

      errorEl.style.display = 'block';
      errorEl.textContent =
        (err.response && err.response.data && err.response.data.error) ||
        err.message ||
        'Failed to load live trade';
    }
  });
})();
</script>

</body>
