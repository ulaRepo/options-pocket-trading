    <script>
    document.addEventListener('DOMContentLoaded', async function () {
      try {
        const { data } = await api.get('/user/dashboard/data');
        if (!data.success || !data.user) {
          throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }

        const u = data.user;
        localStorage.setItem('user', JSON.stringify(u));

        const displayName = u.fullname || u.username || u.email || 'User';
        const avatarSrc = u.image || '../public/assetss/img/pers.svg';

        document.getElementById('account-name-top').textContent = displayName;
        document.getElementById('account-name-side').textContent = displayName;

        document.getElementById('account-avatar-top').src = avatarSrc;
        document.getElementById('account-avatar-side').src = avatarSrc;

        document.getElementById('account-role').textContent = u.role || 'client';
        document.getElementById('account-email').textContent = u.email || '';
        document.getElementById('account-email-link').href = u.email ? ('mailto:' + u.email) : '#';

        document.getElementById('account-type').textContent = u.account || 'basic';
        document.getElementById('account-balance').textContent = u.balance != null ? u.balance : '0';
        document.getElementById('account-verified').textContent = u.verifiedStatus || 'Account not yet Verified!';
        document.getElementById('account-tel').textContent = u.tel || 'Not set';
        document.getElementById('account-gender').textContent = u.gender || 'Not set';
        document.getElementById('account-country').textContent = u.country || 'Not set';
      } catch (err) {
        console.error('Account page auth/data error:', err);
        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }
        document.getElementById('account-name-top').textContent = 'Failed to load';
        document.getElementById('account-name-side').textContent = 'Failed to load';
        document.getElementById('account-email').textContent = 'Failed to load';
        document.getElementById('account-role').textContent = 'Failed to load';
      }
    });
    </script>
