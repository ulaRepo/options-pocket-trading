  <script>
  (function () {
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getUserIdFromQuery() {
      try {
        return new URLSearchParams(window.location.search).get('id');
      } catch (e) {
        return null;
      }
    }

    function getUserIdFromStorage() {
      try {
        var u = JSON.parse(localStorage.getItem('user') || 'null');
        return u && u._id ? u._id : null;
      } catch (e) {
        return null;
      }
    }

    function renderTrades(list) {
      var loading = document.getElementById('lt-loading');
      var table = document.getElementById('user-list-table');
      var tbody = document.getElementById('livetrades-tbody');
      var empty = document.getElementById('lt-empty');

      if (loading) loading.style.display = 'none';

      if (!list || !list.length) {
        if (table) table.style.display = 'none';
        if (empty) empty.style.display = 'block';
        return;
      }

      tbody.innerHTML = list.map(function (t) {
        return (
          '<tr style="background-color:#2A2929;">' +
            '<td style="color:#B3B3B3;">' + escapeHtml(t.type) + '</td>' +
            '<td style="color:#B3B3B3;">' + escapeHtml(t.currencypair) + '</td>' +
            '<td><span style="color:red;">' + escapeHtml(t.action) + '</span></td>' +
            '<td style="color:#B3B3B3;">' + escapeHtml(t.lotsize) + '</td>' +
            '<td style="color:#B3B3B3;">' + escapeHtml(t.entryPrice) + '</td>' +
            '<td style="color:#B3B3B3;">' + escapeHtml(t.stopLoss) + '</td>' +
            '<td style="color:#B3B3B3;">' + escapeHtml(t.takeProfit) + '</td>' +
            '<td class="text-center"></td>' +
          '</tr>'
        );
      }).join('');

      if (empty) empty.style.display = 'none';
      if (table) table.style.display = 'table';
    }

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var userId = getUserIdFromQuery() || getUserIdFromStorage();

        if (!userId) {
          var me = await api.get('/user/dashboard/data');
          if (me.data && me.data.success && me.data.user) {
            userId = me.data.user._id;
            localStorage.setItem('user', JSON.stringify(me.data.user));
          }
        }

        if (!userId) {
          throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }

        var res = await api.get('/user/tradinghistory/' + userId + '/data');
        var data = res.data;
        if (!data.success) {
          throw new Error(data.error || 'Failed to load');
        }

        renderTrades(data.livetrades || []);
      } catch (err) {
        console.error(err);
        var loading = document.getElementById('lt-loading');
        if (loading) loading.style.display = 'none';

        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }

        var empty = document.getElementById('lt-empty');
        if (empty) {
          empty.style.display = 'block';
          empty.textContent =
            (err.response && err.response.data && err.response.data.error) ||
            err.message ||
            'Failed to load trading history';
        }
      }
    });
  })();
  </script>
