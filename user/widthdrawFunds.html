<body>

  <section class="navbar-top">
    <div class="container">
      <div class="navbar-left">
        <a href="./navbarPage.html">
          <img src="../public/assets/vector/hamburger.svg" alt="hamburger" class="hamburger" id="btn" />
        </a>
      </div>
      <div class="navbar-right"></div>
    </div>
  </section>

  <section class="jumbotron" style="background-color: black;">
    <div class="container">
      <div class="withdrawalContent">
        <p class="writer">Withdrawal</p>
        <hr />
        <h1 class="title fw-semibold mt-3 mb-4">withdrawal Method</h1>
        <p class="title fw-sm mt-3 mb-4" id="available">
          Eligible to widthdraw <span style="font-size: large;">$</span><span id="user-balance">0</span>
        </p>

        <form id="withdrawal-form" class="was-validated" autocomplete="off">
          <div class="dropdown mb-3 mt-2">
            <select name="type" id="type" class="btn btn-secondary paymentMethod mt-3 mb-2" required>
              <option value=""><b>---Select Method---</b></option>
              <option value="Bitcoin">Bitcoin</option>
              <option value="Ethereum">Ethereum</option>
              <option value="Litecoin">Litecoin</option>
              <option value="BitcoinCash">BitcoinCash</option>
              <option value="Skrill">Skrill</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>

          <div class="dropdown mb-3 mt-2" id="field1" style="display: none;">
            <label class="label">Bitcoin Wallet:</label>
            <input type="text" name="bitcoin_address" id="bitcoin_address" class="input" placeholder="BTC wallet Address" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field2" style="display: none;">
            <label class="label">Ethereum Wallet:</label>
            <input type="text" name="ethereum_address" id="ethereum_address" class="input" placeholder="Ethereum wallet Address" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field3" style="display: none;">
            <label class="label">Litecoin Wallet:</label>
            <input type="text" name="litecoin_address" id="litecoin_address" class="input" placeholder="Litecoin wallet Address" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field4" style="display: none;">
            <label class="label">Bitcoincash Wallet:</label>
            <input type="text" name="bitcoincash_address" id="bitcoincash_address" class="input" placeholder="Bitcoincash wallet Address" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field5" style="display: none;">
            <label class="label">Skrill:</label>
            <input type="text" name="skrill_email" id="skrill_email" class="input" placeholder="Skrill" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field7" style="display: none;">
            <label class="label">Bank Name:</label>
            <input type="text" name="bank_name" id="bank_name" class="input" placeholder="Bank Name" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field8" style="display: none;">
            <label class="label">Account Number:</label>
            <input type="text" name="account_number" id="account_number" class="input" placeholder="Account Number" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field9" style="display: none;">
            <label class="label">Country:</label>
            <input type="text" name="country" id="country" placeholder="Country" class="input" />
          </div>
          <div class="dropdown mb-3 mt-2" id="field10" style="display: none;">
            <label class="label">Swift Code:</label>
            <input type="text" name="swift_code" id="swift_code" placeholder="Swift Code" class="input" />
          </div>

          <label class="label">Amount:$</label>
          <br />
          <input type="text" name="amount" id="amount" placeholder="Amount without ($)" class="input" required />
          <label class="label">Fee:</label>
          <br />
          <input type="text" class="input feeInput" name="fees" id="fees" value="0%" readonly />
          <label class="label">Description</label>
          <br />
          <textarea cols="30" rows="3" maxlength="20" class="textarea" name="narration" id="narration" placeholder="Narration" style="color: white;"></textarea>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="1" id="flexCheckDefault" />
            <label class="form-check-label" for="flexCheckDefault"> Agree to Terms & Conditions? </label>
          </div>
          <button name="withdraw" type="submit" class="btn-main" id="withdraw-submit">Next</button>
        </form>
      </div>
    </div>
  </section>

  <script src="../public/plugins/js/croppie.min.js"></script>

  <script src="../public/plugins/js/bootstrap4-toggle.min.js"></script>
  <script src="../public/plugins/js/bootstrap-datepicker.min.js"></script>

  <script>
  (function () {
    var currentUserId = null;
    var userBalance = 0;

    function hideAllFields() {
      ['field1','field2','field3','field4','field5','field7','field8','field9','field10'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }

    function setFee(val) {
      var fees = document.getElementById('fees');
      if (fees) fees.value = val;
    }

    document.getElementById('type').addEventListener('change', function () {
      hideAllFields();
      var v = this.value;
      if (v === 'Bitcoin') {
        document.getElementById('field1').style.display = 'block';
        setFee('2%');
      } else if (v === 'Ethereum') {
        document.getElementById('field2').style.display = 'block';
        setFee('4%');
      } else if (v === 'Litecoin') {
        document.getElementById('field3').style.display = 'block';
        setFee('4%');
      } else if (v === 'BitcoinCash') {
        document.getElementById('field4').style.display = 'block';
        setFee('4%');
      } else if (v === 'Skrill') {
        document.getElementById('field5').style.display = 'block';
        setFee('3%');
      } else if (v === 'Bank Transfer') {
        document.getElementById('field7').style.display = 'block';
        document.getElementById('field8').style.display = 'block';
        document.getElementById('field9').style.display = 'block';
        document.getElementById('field10').style.display = 'block';
        setFee('5%');
      } else {
        setFee('0%');
      }
    });

    document.getElementById('withdrawal-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!currentUserId) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Not logged in.' });
        return;
      }

      var terms = document.getElementById('flexCheckDefault');
      if (!terms.checked) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Please agree to Terms & Conditions.' });
        return;
      }

      var type = document.getElementById('type').value;
      var amount = parseFloat(document.getElementById('amount').value);
      var narration = document.getElementById('narration').value;

      if (!type) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Select a withdrawal method.' });
        return;
      }
      if (isNaN(amount) || amount <= 0) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Enter a valid amount.' });
        return;
      }
      if (amount > userBalance) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Insufficient balance.' });
        return;
      }

      var payload = {
        type: type,
        amount: amount,
        narration: narration,
        status: 'pending',
        bitcoin_address: document.getElementById('bitcoin_address').value,
        ethereum_address: document.getElementById('ethereum_address').value,
        litecoin_address: document.getElementById('litecoin_address').value,
        bitcoincash_address: document.getElementById('bitcoincash_address').value,
        skrill_email: document.getElementById('skrill_email').value,
        bank_name: document.getElementById('bank_name').value,
        account_number: document.getElementById('account_number').value,
        country: document.getElementById('country').value,
        swift_code: document.getElementById('swift_code').value
      };

      var btn = document.getElementById('withdraw-submit');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        var { data } = await api.post('/user/widthdraw/' + currentUserId, payload);
        Swal.fire({
          icon: 'success',
          title: 'Success',
          text: data.message || 'Withdrawal request submitted',
          timer: 2500
        }).then(function () {
          window.location.href = './widthdrawHistory.html?id=' + encodeURIComponent(currentUserId);
        });
      } catch (err) {
        var msg = 'Withdrawal failed';
        if (err.response && err.response.data) {
          msg = err.response.data.error || err.response.data.message || msg;
        }
        Swal.fire({ icon: 'error', title: 'Error', text: msg });
      } finally {
        btn.disabled = false;
        btn.textContent = 'Next';
      }
    });

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var res = await api.get('/user/withdrawal/data');
        var data = res.data;
        if (!data.success || !data.user) {
          throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }
        currentUserId = data.user._id;
        userBalance = parseFloat(data.user.balance) || 0;
        document.getElementById('user-balance').textContent = userBalance;
        localStorage.setItem('user', JSON.stringify(
          Object.assign({}, JSON.parse(localStorage.getItem('user') || '{}'), data.user)
        ));
      } catch (err) {
        console.error(err);
        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
        }
      }
    });
  })();
  </script>
