  <script>
  (function () {
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getUserIdFromQuery() {
      try {
        var params = new URLSearchParams(window.location.search);
        return params.get('id');
      } catch (e) {
        return null;
      }
    }

    function getUserIdFromStorage() {
      try {
        var u = JSON.parse(localStorage.getItem('user') || 'null');
        return u && u._id ? u._id : null;
      } catch (e) {
        return null;
      }
    }

    function renderDeposits(deposits) {
      var loading = document.getElementById('deposit-loading');
      var table = document.getElementById('datatable');
      var tbody = document.getElementById('deposit-tbody');
      var empty = document.getElementById('deposit-empty');
      var printBtn = document.getElementById('print-btn');

      if (loading) loading.style.display = 'none';

      if (!deposits || !deposits.length) {
        if (table) table.style.display = 'none';
        if (printBtn) printBtn.style.display = 'none';
        if (empty) empty.style.display = 'block';
        return;
      }

      var rows = deposits.map(function (deposit) {
        return (
          '<tr>' +
            '<td>' + escapeHtml(deposit.type) + '</td>' +
            '<td>' + escapeHtml(deposit.amount) + '</td>' +
            '<td>' + escapeHtml(deposit.narration) + '</td>' +
            '<td>' + escapeHtml(deposit.status) + '</td>' +
          '</tr>'
        );
      }).join('');

      if (tbody) tbody.innerHTML = rows;
      if (empty) empty.style.display = 'none';
      if (table) table.style.display = 'table';
      if (printBtn) printBtn.style.display = 'inline-block';
    }

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var userId = getUserIdFromQuery() || getUserIdFromStorage();

        if (!userId) {
          var me = await api.get('/user/dashboard/data');
          if (me.data && me.data.success && me.data.user) {
            userId = me.data.user._id;
            localStorage.setItem('user', JSON.stringify(me.data.user));
          }
        }

        if (!userId) {
          throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }

        var res = await api.get('/user/depositHistory/' + userId + '/data');
        var data = res.data;

        if (!data.success) {
          throw new Error(data.error || 'Failed to load history');
        }

        if (data.user) {
          localStorage.setItem('user', JSON.stringify(
            Object.assign({}, JSON.parse(localStorage.getItem('user') || '{}'), data.user)
          ));
        }

        renderDeposits(data.deposits || []);
      } catch (err) {
        console.error(err);
        var loading = document.getElementById('deposit-loading');
        if (loading) loading.style.display = 'none';

        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }

        var empty = document.getElementById('deposit-empty');
        if (empty) {
          empty.style.display = 'block';
          empty.textContent = (err.response && err.response.data && err.response.data.error)
            ? err.response.data.error
            : 'Failed to load deposit history';
        }
      }
    });
  })();
  </script>
</body>
</html>
