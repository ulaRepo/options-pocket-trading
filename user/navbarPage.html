<script>
function linkBtn(href, label) {
    return '<a class="div-btn" href="' + href + '"><span class="linkcss">' + label + '</span></a>';
}

function formatDate(value) {
    if (!value) return '—';
    try {
        var d = new Date(value);
        if (isNaN(d.getTime())) return String(value);
        return d.toLocaleString();
    } catch (e) {
        return String(value);
    }
}

document.addEventListener('DOMContentLoaded', async function () {
    document.getElementById('logout-btn').addEventListener('click', function (e) {
        e.preventDefault();
        if (typeof logout === 'function') {
            logout();
        } else {
            window.location.href = '../login.html';
        }
    });

    try {
        const { data } = await api.get('/user/dashboard/data');
        if (!data.success || !data.user) {
            throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }

        const u = data.user;
        localStorage.setItem('user', JSON.stringify(u));

        const fullname = u.fullname || u.username || u.email || 'User';
        const email = u.email || '';
        const id = u._id;

        document.getElementById('nav-fullname').textContent = fullname;
        document.getElementById('nav-email-top').textContent = email;
        document.getElementById('nav-email').textContent = email;
        document.getElementById('nav-createdAt').textContent = formatDate(u.createdAt);
        document.getElementById('nav-verifiedStatus').textContent = u.verifiedStatus || 'Account not yet Verified!';
        document.getElementById('nav-account').textContent = u.account || 'basic';

        let html = '';

        if (u.role === 'ADMIN') {
            html += linkBtn('../admin/adminDashboard.html', 'Dashboard');
            html += linkBtn('../admin/allVerify.html', 'All Verifications');
            html += linkBtn('../admin/allFunding.html', 'All Deposits');
            html += linkBtn('../admin/allWidthdrawals.html', 'All Withdrawals');
            html += linkBtn('../admin/all-affiliates.html', 'all affiliates');
            html += linkBtn('../admin/all-livetrade.html', 'All Live Trades');
            html += linkBtn('../admin/user-copytrades.html', 'users-Copytrade');
            html += linkBtn('../admin/all-accountUpgrade.html', 'All Accounts Upgrade');
            html += linkBtn('../admin/all-copytrades.html', 'created-Experts');
            html += linkBtn('../admin/all-wallets.html', 'wallet Addresses');
        }

        html += linkBtn('./dashboard.html', 'Dashboard');
        html += linkBtn('./verify.html', 'Verify Account');
        html += linkBtn('./deposit.html', 'Deposit');
        html += linkBtn('./copy-expert.html', 'Copy Experts');
        html += linkBtn('./ongoing-copy-trades.html?id=' + encodeURIComponent(id), 'ongoing-copytrades');
        html += linkBtn('./affiliate.html?id=' + encodeURIComponent(id), 'Affiliate Packages');
        html += linkBtn('./widthdrawFunds.html', 'Withdrawal');
        html += linkBtn('./live.html', 'Live Trades');
        html += linkBtn('./accountUpgrade.html', 'Account Upgrade');
        html += linkBtn('./liveHistory.html?id=' + encodeURIComponent(id), 'Livetrade History');
        html += linkBtn('./depositHistory.html?id=' + encodeURIComponent(id), 'Deposit History');
        html += linkBtn('./widthdrawHistory.html?id=' + encodeURIComponent(id), 'Widthdraw History');

        document.getElementById('nav-links').innerHTML = html;
    } catch (err) {
        console.error('Navbar auth/data error:', err);
        if (err.response && err.response.status === 401) {
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        } else {
            document.getElementById('nav-fullname').textContent = 'Failed to load';
            document.getElementById('nav-email-top').textContent = '';
        }
    }
});
</script>
