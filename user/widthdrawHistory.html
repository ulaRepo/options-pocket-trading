  <script>
  (function () {
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getUserIdFromQuery() {
      try {
        return new URLSearchParams(window.location.search).get('id');
      } catch (e) {
        return null;
      }
    }

    function getUserIdFromStorage() {
      try {
        var u = JSON.parse(localStorage.getItem('user') || 'null');
        return u && u._id ? u._id : null;
      } catch (e) {
        return null;
      }
    }

    function renderRows(list) {
      var loading = document.getElementById('wd-loading');
      var table = document.getElementById('datatable');
      var tbody = document.getElementById('widthdraw-tbody');
      var empty = document.getElementById('wd-empty');
      var printBtn = document.getElementById('print-btn');

      if (loading) loading.style.display = 'none';

      if (!list || !list.length) {
        if (table) table.style.display = 'none';
        if (printBtn) printBtn.style.display = 'none';
        if (empty) empty.style.display = 'block';
        return;
      }

      tbody.innerHTML = list.map(function (w) {
        return (
          '<tr>' +
            '<td>' + escapeHtml(w.type) + '</td>' +
            '<td>' + escapeHtml(w.amount) + '</td>' +
            '<td>' + escapeHtml(w.narration) + '</td>' +
            '<td>' + escapeHtml(w.status) + '</td>' +
          '</tr>'
        );
      }).join('');

      if (empty) empty.style.display = 'none';
      if (table) table.style.display = 'table';
      if (printBtn) printBtn.style.display = 'inline-block';
    }

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var userId = getUserIdFromQuery() || getUserIdFromStorage();

        if (!userId) {
          var me = await api.get('/user/dashboard/data');
          if (me.data && me.data.success && me.data.user) {
            userId = me.data.user._id;
            localStorage.setItem('user', JSON.stringify(me.data.user));
          }
        }

        if (!userId) {
          throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }

        var res = await api.get('/user/widthdrawHistory/' + userId + '/data');
        var data = res.data;
        if (!data.success) {
          throw new Error(data.error || 'Failed to load');
        }

        renderRows(data.widthdraws || []);
      } catch (err) {
        console.error(err);
        var loading = document.getElementById('wd-loading');
        if (loading) loading.style.display = 'none';

        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
          return;
        }

        var empty = document.getElementById('wd-empty');
        if (empty) {
          empty.style.display = 'block';
          empty.textContent =
            (err.response && err.response.data && err.response.data.error) ||
            err.message ||
            'Failed to load withdrawal history';
        }
      }
    });
  })();
