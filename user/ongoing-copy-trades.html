<script>
(function () {
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatMoney(val) {
    var n = Number(val);
    if (isNaN(n)) return '0.00';
    return n.toFixed(2);
  }

  function formatDate(val) {
    if (!val) return 'N/A';
    try {
      return new Date(val).toLocaleDateString();
    } catch (e) {
      return 'N/A';
    }
  }

  function getUserIdFromQuery() {
    try {
      return new URLSearchParams(window.location.search).get('id');
    } catch (e) {
      return null;
    }
  }

  function getUserIdFromStorage() {
    try {
      var u = JSON.parse(localStorage.getItem('user') || 'null');
      return u && u._id ? u._id : null;
    } catch (e) {
      return null;
    }
  }

  function renderTrades(copyTrades) {
    var tbody = document.getElementById('ongoingTradesBody');
    if (!tbody) return;

    if (!copyTrades || !copyTrades.length) {
      tbody.innerHTML =
        '<tr>' +
          '<td colspan="7" class="text-center py-4">No ongoing copy trades found.</td>' +
        '</tr>';
      return;
    }

    var rows = copyTrades.map(function (trade) {
      var status = (trade.status || 'ongoing').toLowerCase();
      var statusClass = status === 'completed' ? 'status-completed' : 'status-ongoing';
      var id = escapeHtml(trade._id);

      return (
        '<tr data-trade-id="' + id + '">' +
          '<td>' + escapeHtml(trade.traderName || 'N/A') + '</td>' +
          '<td>$' + formatMoney(trade.amount) + '</td>' +
          '<td>' + escapeHtml(trade.duration != null ? trade.duration : 'N/A') + ' days</td>' +
          '<td>' + escapeHtml(formatDate(trade.startDate)) + '</td>' +
          '<td>' + escapeHtml(formatDate(trade.endDate)) + '</td>' +
          '<td class="profit-display">$' + formatMoney(trade.currentProfit) + '</td>' +
          '<td><span class="' + statusClass + '">' + escapeHtml(status) + '</span></td>' +
        '</tr>'
      );
    }).join('');

    tbody.innerHTML = rows;
  }

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var userId = getUserIdFromQuery() || getUserIdFromStorage();

      if (!userId) {
        var me = await api.get('/user/dashboard/data');
        if (me.data && me.data.success && me.data.user) {
          userId = me.data.user._id;
          localStorage.setItem('user', JSON.stringify(me.data.user));
        }
      }

      if (!userId) {
        throw Object.assign(new Error('No user'), { response: { status: 401 } });
      }

      var res = await api.get('/user/ongoing-copy-trades/' + userId + '/data');
      var data = res.data;

      if (!data.success) {
        throw new Error(data.error || 'Failed to load trades');
      }

      if (data.user) {
        localStorage.setItem(
          'user',
          JSON.stringify(
            Object.assign({}, JSON.parse(localStorage.getItem('user') || '{}'), data.user)
          )
        );
      }

      renderTrades(data.copyTrades || []);
    } catch (err) {
      console.error(err);
      var tbody = document.getElementById('ongoingTradesBody');

      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }

      var msg =
        (err.response && err.response.data && err.response.data.error) ||
        err.message ||
        'Failed to load copy trades';

      if (tbody) {
        tbody.innerHTML =
          '<tr><td colspan="7" class="text-center py-4 text-danger">' +
          escapeHtml(msg) +
          '</td></tr>';
      }
    }
  });
})();
</script>
