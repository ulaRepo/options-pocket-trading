  <script>
  (function () {
    var currentUserId = null;

    document.getElementById('live-trade-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!currentUserId) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Not logged in.' });
        return;
      }

      var payload = {
        type: document.getElementById('type').value,
        currencypair: document.getElementById('currencypair').value.trim(),
        lotsize: document.getElementById('lotsize').value.trim(),
        entryPrice: document.getElementById('entryPrice').value.trim(),
        stopLoss: document.getElementById('stopLoss').value.trim(),
        takeProfit: document.getElementById('takeProfit').value.trim(),
        action: document.getElementById('action').value
      };

      if (!payload.type || !payload.currencypair || !payload.lotsize || !payload.entryPrice || !payload.stopLoss || !payload.takeProfit || !payload.action) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Please fill all fields.' });
        return;
      }

      var btn = document.getElementById('execute-btn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        var { data } = await api.post('/user/trading-live/' + currentUserId, payload);
        Swal.fire({
          icon: 'success',
          title: 'Success',
          text: data.message || 'Live trade executed successfully',
          timer: 2000
        }).then(function () {
          window.location.href = './liveHistory.html?id=' + encodeURIComponent(currentUserId);
        });
      } catch (err) {
        var msg = 'Failed to execute trade';
        if (err.response && err.response.data) {
          msg = err.response.data.error || err.response.data.message || msg;
        }
        Swal.fire({ icon: 'error', title: 'Error', text: msg });
      } finally {
        btn.disabled = false;
        btn.textContent = 'Execute Trade';
      }
    });

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var res = await api.get('/user/trading-live/data');
        var data = res.data;
        if (!data.success || !data.user) {
          throw Object.assign(new Error('No user'), { response: { status: 401 } });
        }
        currentUserId = data.user._id;
        document.getElementById('user-balance').textContent = data.user.balance != null ? data.user.balance : '0';
        localStorage.setItem('user', JSON.stringify(
          Object.assign({}, JSON.parse(localStorage.getItem('user') || '{}'), data.user)
        ));
      } catch (err) {
        console.error(err);
        if (err.response && (err.response.status === 401 || err.response.status === 403)) {
          localStorage.removeItem('user');
          window.location.href = '../login.html';
        }
      }
    });
  })();
  </script>
