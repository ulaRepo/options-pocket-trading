            <div class="card affiliate-card mb-4">

            <div class="card affiliate-card mt-4">

<script>
(function () {
  var currentUserId = null;
  var availableBalance = 0;

  var PLANS = [
    {
      id: '3',
      type: 'Affiliate Tier Bot',
      min: 100,
      max: 1000,
      growth: '500% Daily Growth',
      roi: '10550%',
      duration: '3 days'
    },
    {
      id: '4',
      type: 'Affiliate Tier Bot Niche',
      min: 2000,
      max: 10000,
      growth: '1000% Daily Growth',
      roi: '50000%',
      duration: '10 days'
    },
    {
      id: '5',
      type: 'Affiliate Tier Bot Ecommerce',
      min: 5000,
      max: 100000,
      growth: '5000% Daily Growth',
      roi: '5500%',
      duration: '31 days'
    }
  ];

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatMoney(val) {
    var n = parseFloat(val);
    if (isNaN(n)) return '0.00';
    return n.toFixed(2);
  }

  function formatDate(val) {
    if (!val) return 'N/A';
    try {
      return new Date(val).toLocaleString();
    } catch (e) {
      return 'N/A';
    }
  }

  function getUserIdFromQuery() {
    try {
      return new URLSearchParams(window.location.search).get('id');
    } catch (e) {
      return null;
    }
  }

  function getUserIdFromStorage() {
    try {
      var u = JSON.parse(localStorage.getItem('user') || 'null');
      return u && u._id ? u._id : null;
    } catch (e) {
      return null;
    }
  }

  function renderPlans() {
    var row = document.getElementById('plans-row');
    if (!row) return;

    row.innerHTML = PLANS.map(function (plan) {
      return (
        '<div class="col-lg-4 col-md-6 mb-4">' +
          '<div class="card plan-card h-100">' +
            '<div class="card-header">' + escapeHtml(plan.type) + '</div>' +
            '<div class="card-body">' +
              '<h5>$' + formatMoney(plan.min) + ' - $' + formatMoney(plan.max) + '</h5>' +
              '<p>' + escapeHtml(plan.growth) + '</p>' +
              '<p>ROI: ' + escapeHtml(plan.roi) + '</p>' +
              '<p>Duration: ' + escapeHtml(plan.duration) + '</p>' +
              '<form class="affiliate-form">' +
                '<input type="hidden" name="aff_plan_id" value="' + escapeHtml(plan.id) + '">' +
                '<div class="input-group mb-3">' +
                  '<div class="input-group-prepend">' +
                    '<span class="input-group-text">$</span>' +
                  '</div>' +
                  '<input type="number" class="form-control" name="amount" min="' + plan.min + '" max="' + plan.max + '" step="any" required placeholder="Enter Amount">' +
                '</div>' +
                '<button type="submit" class="btn btn-primary btn-block">Purchase Plan</button>' +
              '</form>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    bindAffiliateForms();
  }

  function renderAffiliates(list) {
    var loading = document.getElementById('affiliates-loading');
    var empty = document.getElementById('affiliates-empty');
    var wrap = document.getElementById('affiliates-table-wrap');
    var tbody = document.getElementById('affiliate-table');

    if (loading) loading.style.display = 'none';

    if (!list || !list.length) {
      if (wrap) wrap.style.display = 'none';
      if (empty) empty.style.display = 'block';
      return;
    }

    if (empty) empty.style.display = 'none';
    if (wrap) wrap.style.display = 'block';

    tbody.innerHTML = list.map(function (aff) {
      return (
        '<tr>' +
          '<td>' + escapeHtml(aff.type || 'N/A') + '</td>' +
          '<td>$' + formatMoney(aff.amount) + '</td>' +
          '<td>' + escapeHtml(aff.roi || 'N/A') + '</td>' +
          '<td>' + escapeHtml(aff.duration || 'N/A') + '</td>' +
          '<td>' + escapeHtml(formatDate(aff.createdAt)) + '</td>' +
        '</tr>'
      );
    }).join('');
  }

  function setBalance(balance) {
    availableBalance = parseFloat(balance) || 0;
    var el = document.getElementById('availableBalance');
    if (el) el.textContent = formatMoney(availableBalance);
  }

  function bindAffiliateForms() {
    document.querySelectorAll('.affiliate-form').forEach(function (form) {
      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        if (!currentUserId) {
          Swal.fire('Error', 'Not logged in.', 'error');
          return;
        }

        var affPlanId = this.querySelector('[name="aff_plan_id"]').value;
        var amount = parseFloat(this.querySelector('[name="amount"]').value);
        var plan = PLANS.find(function (p) { return p.id === affPlanId; });

        if (!plan || isNaN(amount) || amount < plan.min || amount > plan.max) {
          Swal.fire(
            'Invalid Amount',
            'Amount must be between $' + plan.min + ' and $' + plan.max,
            'error'
          );
          return;
        }

        if (amount > availableBalance) {
          Swal.fire(
            'Insufficient Balance',
            'You do not have enough available balance.',
            'error'
          );
          return;
        }

        var result = await Swal.fire({
          title: 'Confirm Purchase',
          text: 'Purchase this affiliate plan for $' + amount.toFixed(2) + '?',
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'Purchase'
        });

        if (!result.isConfirmed) return;

        var submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';

        try {
          var { data } = await api.post('/user/page/' + currentUserId, {
            aff_plan_id: affPlanId,
            amount: amount
          });

          if (data.balance != null) setBalance(data.balance);

          Swal.fire(
            'Success',
            data.message || 'Affiliate plan purchased successfully.',
            'success'
          ).then(function () {
            loadPageData();
          });
        } catch (err) {
          var msg = 'Failed to process request';
          if (err.response && err.response.data) {
            msg = err.response.data.error || err.response.data.message || msg;
          } else if (err.message) {
            msg = err.message;
          }
          Swal.fire('Error', msg, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Purchase Plan';
        }
      });
    });
  }

  async function loadPageData() {
    var userId = getUserIdFromQuery() || getUserIdFromStorage() || currentUserId;

    if (!userId) {
      var me = await api.get('/user/dashboard/data');
      if (me.data && me.data.success && me.data.user) {
        userId = me.data.user._id;
        localStorage.setItem('user', JSON.stringify(me.data.user));
      }
    }

    if (!userId) {
      throw Object.assign(new Error('No user'), { response: { status: 401 } });
    }

    currentUserId = userId;

    var res = await api.get('/user/page/' + userId + '/data');
    var payload = res.data;

    if (!payload.success) {
      throw new Error(payload.error || 'Failed to load');
    }

    if (payload.user) {
      localStorage.setItem(
        'user',
        JSON.stringify(
          Object.assign({}, JSON.parse(localStorage.getItem('user') || '{}'), payload.user)
        )
      );
      setBalance(payload.user.balance);
    }

    renderAffiliates(payload.affiliates || []);
  }

  document.addEventListener('DOMContentLoaded', async function () {
    renderPlans();

    try {
      await loadPageData();
    } catch (err) {
      console.error(err);
      var loading = document.getElementById('affiliates-loading');
      if (loading) loading.style.display = 'none';

      if (err.response && (err.response.status === 401 || err.response.status === 403)) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
        return;
      }

      Swal.fire(
        'Error',
        (err.response && err.response.data && err.response.data.error) ||
          err.message ||
          'Failed to load affiliate page',
        'error'
      );
    }
  });
})();
</script>

</body>
