<script>
(function () {
  var currentStep = 0;
  var fieldsets = document.querySelectorAll('#form-wizard1 fieldset');
  var tabIds = ['account', 'personal', 'payment', 'confirm'];
  var currentUserId = null;

  function showStep(index) {
    currentStep = index;
    fieldsets.forEach(function (fs, i) {
      fs.classList.toggle('active', i === index);
    });
    tabIds.forEach(function (id, i) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle('active', i === index);
    });
  }

  document.querySelectorAll('#form-wizard1 .next').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (currentStep < fieldsets.length - 1) showStep(currentStep + 1);
    });
  });

  document.querySelectorAll('#form-wizard1 .previous').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (currentStep > 0) showStep(currentStep - 1);
    });
  });

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var res = await api.get('/user/dashboard/data');
      var data = res.data;
      if (!data.success || !data.user) {
        throw Object.assign(new Error('No user'), { response: { status: 401 } });
      }

      var u = data.user;
      currentUserId = u._id;
      localStorage.setItem('user', JSON.stringify(u));

      document.getElementById('verify-status').textContent = u.verifiedStatus || 'Account not yet Verified!';
      document.getElementById('email').value = u.email || '';
      document.getElementById('username').value = u.username || (u.email ? u.email.split('@')[0] : '');
      document.getElementById('fullname').value = u.fullname || '';
    } catch (err) {
      console.error(err);
      if (err.response && err.response.status === 401) {
        localStorage.removeItem('user');
        window.location.href = '../login.html';
      } else {
        document.getElementById('verify-status').textContent = 'Failed to load status';
      }
    }
  });

  document.getElementById('form-wizard1').addEventListener('submit', async function (e) {
    e.preventDefault();

    if (!currentUserId) {
      Swal.fire({ icon: 'error', title: 'Not logged in', text: 'Please login again.' });
      return;
    }

    var front = document.getElementById('idcardFront').files[0];
    var back = document.getElementById('idcardBack').files[0];
    if (!front || !back) {
      Swal.fire({ icon: 'error', title: 'Missing files', text: 'Both front and back ID card images are required.' });
      return;
    }

    var formData = new FormData();
    formData.append('email', document.getElementById('email').value.trim());
    formData.append('username', document.getElementById('username').value.trim());
    formData.append('fullname', document.getElementById('fullname').value.trim());
    formData.append('city', document.getElementById('city').value.trim());
    formData.append('gender', (document.querySelector('input[name="gender"]:checked') || {}).value || '');
    formData.append('dob', document.getElementById('dob').value);
    formData.append('marital_status', document.getElementById('marital_status').value);
    formData.append('age', document.getElementById('age').value);
    formData.append('address', document.getElementById('address').value.trim());
    formData.append('idcardFront', front);
    formData.append('idcardBack', back);

    Swal.fire({
      title: 'Uploading Documents...',
      text: 'Please wait while your documents are being uploaded.',
      allowOutsideClick: false,
      allowEscapeKey: false,
      didOpen: function () { Swal.showLoading(); }
    });

    try {
        var result = await api.post('/user/verify/' + currentUserId, formData, {
    headers: {
      'Content-Type': false
    },
    transformRequest: [
      function (data, headers) {
        if (data instanceof FormData) {
          delete headers['Content-Type'];
          if (headers.common) delete headers.common['Content-Type'];
          if (headers.post) delete headers.post['Content-Type'];
        }
        return data;
      }
    ]
  });
  Swal.fire({
    icon: 'success',
    title: 'Verification Submitted',
    text: (result.data && result.data.message) || 'Your verification application was submitted successfully. Under review now.',
    confirmButtonText: 'OK'
  }).then(function () {
    window.location.href = './dashboard.html';
  });
    } catch (err) {
      var msg = 'Verification failed';
  if (err.response && err.response.data) {
    msg = err.response.data.error || err.response.data.message || msg;
  }
  Swal.fire({
    icon: 'error',
    title: 'Verification Failed',
    text: msg,
    confirmButtonText: 'OK'
  });
    }
  });
})();
</script>
